<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Brand Letter Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="85%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Code Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Squircle -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="10" filter="url(#dropShadow)" />

  <!-- Inner Subtle Glass Rim -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Code Bracket Left: < -->
  <path d="M 112 216 L 76 256 L 112 296" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right: > -->
  <path d="M 400 216 L 436 256 L 400 296" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram Letter "B" (Bold & Modern) -->
  <path fill-rule="evenodd" clip-rule="evenodd" fill="url(#brandGrad)" filter="url(#softGlow)"
    d="M 165 130 
       C 151 130 140 141 140 155 
       L 140 357 
       C 140 371 151 382 165 382 
       L 282 382 
       C 334 382 368 354 368 312 
       C 368 281 349 261 320 253 
       C 342 243 358 226 358 198 
       C 358 158 327 130 278 130 
       Z 
       M 205 182 
       L 268 182 
       C 292 182 305 192 305 208 
       C 305 224 292 234 268 234 
       L 205 234 
       Z 
       M 205 278 
       L 274 278 
       C 301 278 315 290 315 308 
       C 315 326 301 336 274 336 
       L 205 336 
       Z" />

  <!-- Tech Accent Dot (Cyber Spark) -->
  <circle cx="338" cy="148" r="9" fill="#38bdf8" />
  <circle cx="338" cy="148" r="16" fill="#38bdf8" opacity="0.4" />
</svg>